<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>知猿 - 个人中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --primary: #ff0036; --ink: #000; --body: #33332e; --mute: #62625b; --ash: #91918c; --hairline: #dadad3; --canvas: #fff; --surface-soft: #fbfbf9; --surface-card: #f6f6f3; --on-primary: #fff; --rounded-md: 16px; --rounded-lg: 32px; --rounded-full: 9999px; }
body { font-family: Inter, -apple-system, sans-serif; color: var(--body); background: var(--surface-soft); line-height: 1.4; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.header { height: 64px; background: var(--canvas); border-bottom: 1px solid var(--hairline); position: sticky; top: 0; z-index: 100; display: flex; align-items: center; }
.header .container { display: flex; align-items: center; width: 100%; }
.logo { font-size: 22px; font-weight: 700; color: var(--primary); margin-right: 32px; text-decoration: none; }
.nav-main { display: flex; gap: 24px; list-style: none; }
.nav-main a { text-decoration: none; color: var(--ink); font-size: 16px; font-weight: 600; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.user-avatar { width: 36px; height: 36px; border-radius: var(--rounded-full); background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.user-name { font-size: 14px; font-weight: 600; }

/* Layout */
.user-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 32px 0; min-height: calc(100vh - 64px); }

/* Sidebar */
.user-sidebar { background: var(--canvas); border-radius: var(--rounded-md); padding: 24px; height: fit-content; }
.user-sidebar .profile { text-align: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--hairline); }
.user-sidebar .avatar { width: 64px; height: 64px; border-radius: var(--rounded-full); background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; margin: 0 auto 12px; }
.user-sidebar .name { font-size: 16px; font-weight: 700; color: var(--ink); }
.user-sidebar .vip-badge { display: inline-block; background: #fff0f3; color: var(--primary); padding: 2px 10px; border-radius: var(--rounded-full); font-size: 12px; font-weight: 700; margin-top: 6px; }
.sidebar-nav { list-style: none; }
.sidebar-nav li a { display: block; padding: 12px 16px; border-radius: var(--rounded-md); font-size: 14px; font-weight: 600; color: var(--body); text-decoration: none; margin-bottom: 4px; }
.sidebar-nav li a:hover { background: var(--surface-card); }
.sidebar-nav li a.active { background: var(--surface-card); color: var(--primary); }

/* Content */
.user-content { background: var(--canvas); border-radius: var(--rounded-md); padding: 32px; }
.user-content h2 { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 24px; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
.stat-card { background: var(--surface-card); border-radius: var(--rounded-md); padding: 20px; text-align: center; }
.stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-card .label { font-size: 12px; color: var(--mute); margin-top: 4px; }

/* Table */
.table-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--mute); padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
td { font-size: 14px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
td .status-done { color: #1aae39; font-weight: 600; }
td .status-pending { color: var(--ash); font-weight: 600; }

.footer { background: var(--canvas); padding: 32px 0; border-top: 1px solid var(--hairline); text-align: center; font-size: 12px; color: var(--ash); }
@media (max-width: 768px) { .user-layout { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
