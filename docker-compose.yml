version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zioran-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zioran-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zioran-backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8080
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USERNAME=${EMAIL_SMTP_USERNAME:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - EMAIL_SMTP_FROM=${EMAIL_SMTP_FROM:-}
      - EMAIL_SMTP_SUBJECT=${EMAIL_SMTP_SUBJECT:-知猿验证码}
      - PAYMENT_WECHAT_ENABLED=${PAYMENT_WECHAT_ENABLED:-false}
      - PAYMENT_WECHAT_MOCK_AUTO_COMPLETE=${PAYMENT_WECHAT_MOCK_AUTO_COMPLETE:-false}
      - PAYMENT_WECHAT_APP_ID=${PAYMENT_WECHAT_APP_ID:-}
      - PAYMENT_WECHAT_MCH_ID=${PAYMENT_WECHAT_MCH_ID:-}
      - PAYMENT_WECHAT_API_KEY=${PAYMENT_WECHAT_API_KEY:-}
      - PAYMENT_WECHAT_NOTIFY_URL=${PAYMENT_WECHAT_NOTIFY_URL:-https://api.zioran.com/api/v1/pay/notify/wechat}
      - PAYMENT_WECHAT_SERIAL_NO=${PAYMENT_WECHAT_SERIAL_NO:-}
      - PAYMENT_WECHAT_PRIVATE_KEY_PATH=${PAYMENT_WECHAT_PRIVATE_KEY_PATH:-}
      - PAYMENT_WECHAT_CERT_PATH=${PAYMENT_WECHAT_CERT_PATH:-}
      - PAYMENT_WECHAT_PUBLIC_KEY_PATH=${PAYMENT_WECHAT_PUBLIC_KEY_PATH:-}
      - PAYMENT_WECHAT_PUBLIC_KEY_ID=${PAYMENT_WECHAT_PUBLIC_KEY_ID:-}
      - PAYMENT_ALIPAY_ENABLED=${PAYMENT_ALIPAY_ENABLED:-false}
      - PAYMENT_ALIPAY_MOCK_AUTO_COMPLETE=${PAYMENT_ALIPAY_MOCK_AUTO_COMPLETE:-false}
      - PAYMENT_ALIPAY_APP_ID=${PAYMENT_ALIPAY_APP_ID:-}
      - PAYMENT_ALIPAY_PRIVATE_KEY=${PAYMENT_ALIPAY_PRIVATE_KEY:-}
      - PAYMENT_ALIPAY_PUBLIC_KEY=${PAYMENT_ALIPAY_PUBLIC_KEY:-}
      - PAYMENT_ALIPAY_NOTIFY_URL=${PAYMENT_ALIPAY_NOTIFY_URL:-https://api.zioran.com/api/v1/pay/notify/alipay}
      - PAYMENT_ALIPAY_RETURN_URL=${PAYMENT_ALIPAY_RETURN_URL:-https://www.zioran.com/user/transactions}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.zioran.com/api/v1
    container_name: zioran-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.zioran.com/api/v1
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: zioran-admin
    ports:
      - "3001:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: zioran-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
